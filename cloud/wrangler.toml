name = "pal-command"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The PWA is served from ./public as static assets; /api/* goes to the Worker.
assets = { directory = "./public", binding = "ASSETS" }

# Short-lived cache for inventory/station snapshots pulled from the host.
# Create with:  npx wrangler kv namespace create PALCMD_CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

[vars]
# Non-secret defaults. Secrets (APP_TOKEN, DATHOST_USER, DATHOST_KEY) go in via
#   npx wrangler secret put APP_TOKEN
SNAPSHOT_TTL_SECONDS = "15"

# One entry per managed server. For v1 a single server is fine.
# DATHOST_SERVER_ID is set as a var or secret.
DATHOST_SERVER_ID = "REPLACE_WITH_SERVER_ID"
MOD_DATA_PATH = "Binaries/Win64/ue4ss/Mods/PalCommand/data"
