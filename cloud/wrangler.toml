name = "pal-command"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The PWA is served from ./public as static assets; /api/* goes to the Worker.
assets = { directory = "./public", binding = "ASSETS" }

# Short-lived cache for the inventory/station snapshot pulled from DatHost.
#   npx wrangler kv namespace create PALCMD_CACHE
# then paste the printed id below.
[[kv_namespaces]]
binding = "CACHE"
id = "d333d66e98c842b298584ec8c8923348"

[vars]
SNAPSHOT_TTL_SECONDS = "15"
MOD_DATA_PATH = "Binaries/Win64/ue4ss/Mods/PalCommand/data"
# The server id from the DatHost URL. Not a secret (it's in every API path).
DATHOST_SERVER_ID = "6a9966f03a02c380ecdb8e18"

# Secrets — set with the CLI, never committed:
#   npx wrangler secret put APP_TOKEN        # you invent this; you'll type it into the app
#   npx wrangler secret put DATHOST_USER     # your DatHost account email
#   npx wrangler secret put DATHOST_KEY      # your DatHost account password
