<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16130f" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<title>Pal Command</title>
<style>
  /* ---- tokens : light (bare :root) ---------------------------------- */
  :root {
    --ground: #efe9db;
    --panel: #f9f4e9;
    --panel-2: #f1ead9;
    --line: #ddd2bd;
    --line-strong: #c9bda3;
    --text: #221d15;
    --dim: #6f6656;
    --accent: #b4640f;        /* brass, darkened for light bg */
    --accent-ink: #fff5e8;
    --good: #4d7c3a;
    --warn: #9a6a12;
    --bad: #a5402c;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -16px rgba(40,30,10,.25);
    --r: 10px;
  }
  /* ---- tokens : dark via OS default (un-stamped) ------------------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16130f;
      --panel: #201b14;
      --panel-2: #2a2318;
      --line: #392f22;
      --line-strong: #4b3f2d;
      --text: #f0e9db;
      --dim: #9c9082;
      --accent: #e39a3c;
      --accent-ink: #1c1408;
      --good: #7fb069;
      --warn: #e3b23c;
      --bad: #cd6551;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
    }
  }
  /* ---- tokens : dark via explicit toggle -------------------------- */
  :root[data-theme="dark"] {
    --ground: #16130f;
    --panel: #201b14;
    --panel-2: #2a2318;
    --line: #392f22;
    --line-strong: #4b3f2d;
    --text: #f0e9db;
    --dim: #9c9082;
    --accent: #e39a3c;
    --accent-ink: #1c1408;
    --good: #7fb069;
    --warn: #e3b23c;
    --bad: #cd6551;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font: 400 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 8px; }

  /* header + status strip */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .mark { font: 700 21px/1 "Oswald", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  .mark b { color: var(--accent); font-weight: 700; }
  .ver { font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--dim); letter-spacing: .05em; }

  .strip {
    display: flex; align-items: center; gap: 8px; margin: 10px 0 14px;
    padding: 8px 11px; border: 1px solid var(--line); border-left: 3px solid var(--line-strong);
    border-radius: 6px; background: var(--panel); font-size: 12.5px;
  }
  .strip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .strip.native { border-left-color: var(--good); }
  .strip.native .dot { background: var(--good); }
  .strip.replay { border-left-color: var(--warn); }
  .strip.replay .dot { background: var(--warn); }
  .strip.bad { border-left-color: var(--bad); }
  .strip.bad .dot { background: var(--bad); }
  .strip .sync { margin-left: auto; color: var(--dim); font-family: "IBM Plex Mono", monospace; font-size: 11px; }

  h1, h2, h3 { margin: 0; font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
  h2 { font-size: 15px; }
  h3 { font-size: 13px; color: var(--dim); }
  .lede { color: var(--dim); font-size: 13px; margin: 4px 0 0; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card > .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .count { font: 500 11px/1 "IBM Plex Mono", monospace; color: var(--dim); letter-spacing: .04em; }

  /* controls */
  input, select, button { font: inherit; color: var(--text); }
  .field { position: relative; }
  input, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line-strong);
    border-radius: 7px; padding: 11px 12px; appearance: none;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  label.chk { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); font-size: 13px; }
  label.chk input { width: auto; }

  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px;
    padding: 11px 16px; font-weight: 600; font-family: "Oswald", sans-serif; letter-spacing: .06em;
    text-transform: uppercase; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line-strong); }
  button.mini { padding: 5px 9px; font-size: 11px; }
  button.link { background: none; border: 0; color: var(--bad); padding: 6px 0; font-family: inherit; letter-spacing: 0; text-transform: none; font-weight: 500; }

  .stack { display: grid; gap: 9px; }
  .inline { display: flex; gap: 9px; align-items: center; }
  .inline > * { min-width: 0; }
  .inline > .grow { flex: 1; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .trio label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; }
  input[type="checkbox"] { appearance: auto; -webkit-appearance: checkbox; width: 17px; height: 17px; accent-color: var(--accent); flex: none; padding: 0; }

  /* ledger rows */
  .ledger { display: grid; }
  .ledger .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .ledger .row:last-child { border-bottom: 0; }
  .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id { font: 400 10.5px/1.4 "IBM Plex Mono", monospace; color: var(--dim); background: var(--panel-2);
    border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; flex: none; }
  .qty { font-variant-numeric: tabular-nums; font-weight: 600; font-family: "IBM Plex Mono", monospace; }

  .chip { font: 500 11px/1.3 "IBM Plex Mono", monospace; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--dim); white-space: nowrap; }
  .chip.run { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line-strong)); }
  .chip.idle { color: var(--dim); }
  .chip.src { text-transform: none; }

  details > summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 7px 0; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "+ "; color: var(--accent); font-family: "IBM Plex Mono", monospace; }
  details[open] > summary::before { content: "– "; }

  .empty { text-align: center; color: var(--dim); font-size: 13px; padding: 22px 8px; }
  .err { color: var(--bad); font-size: 12.5px; }

  /* tab bar */
  nav.tabs {
    position: fixed; inset: auto 0 0 0; z-index: 20; display: flex;
    background: var(--panel); border-top: 1px solid var(--line-strong);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; background: none; color: var(--dim); border: 0; border-radius: 0;
    padding: 11px 4px 13px; font: 600 10px/1 "Oswald", sans-serif; letter-spacing: .1em; text-transform: uppercase;
    display: grid; gap: 5px; justify-items: center;
  }
  nav.tabs button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 8px);
    background: var(--text); color: var(--ground); font-size: 13.5px; font-weight: 500;
    padding: 10px 16px; border-radius: 7px; z-index: 30; max-width: 88vw;
    opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #fff; }

  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line-strong);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark">Pal&nbsp;<b>Command</b></span>
    <span class="ver" id="ver">—</span>
  </header>
  <div class="strip" id="strip" hidden>
    <span class="dot"></span>
    <span id="stripText">Conectando…</span>
    <span class="sync" id="stripSync"></span>
  </div>

  <!-- SETUP -->
  <section id="v-setup" hidden>
    <div class="card">
      <div class="head"><h2>Conectar</h2></div>
      <p class="lede">Pega la dirección de tu Worker y el token de acceso. Se guardan solo en este teléfono.</p>
      <div class="stack" style="margin-top:12px">
        <div class="field"><input id="cfgUrl" placeholder="https://pal-command.tu-cuenta.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false" /></div>
        <div class="field"><input id="cfgToken" type="password" placeholder="Token de acceso" autocapitalize="off" autocorrect="off" spellcheck="false" /></div>
        <button id="cfgSave">Conectar</button>
        <button class="ghost" id="cfgDemo">Ver demostración</button>
        <p class="err" id="cfgErr" hidden></p>
      </div>
    </div>
  </section>

  <!-- STOCK -->
  <section id="v-stock" hidden>
    <div class="card">
      <div class="head"><h2>Almacén del servidor</h2><span class="count" id="stockCount"></span></div>
      <div class="field" style="margin-bottom:6px"><input id="stockSearch" placeholder="Buscar…" autocapitalize="off" /></div>
      <div class="ledger" id="stockList"></div>
    </div>
    <div id="stockBases"></div>
  </section>

  <!-- ORDER -->
  <section id="v-order" hidden>
    <div class="card">
      <div class="head"><h2>Nueva orden</h2></div>
      <div class="stack">
        <div class="field"><select id="ordRecipe"></select></div>
        <div class="inline">
          <div class="field grow"><input id="ordCount" type="number" min="1" inputmode="numeric" value="50" /></div>
          <button id="ordGo">Pedir</button>
        </div>
        <label class="chk"><input type="checkbox" id="ordTransport" checked /> Un Pal lo lleva al cofre</label>
        <p class="lede" id="ordHint"></p>
      </div>
    </div>
    <div class="card">
      <div class="head"><h3>Estado del taller</h3><span class="count" id="floorCount"></span></div>
      <div class="ledger" id="floorList"></div>
    </div>
  </section>

  <!-- RULES -->
  <section id="v-rules" hidden>
    <div class="card">
      <div class="head"><h2>Reglas fijas</h2></div>
      <p class="lede">Cuando el total baja del mínimo, se fabrica hasta el objetivo — en tandas.</p>
      <div class="stack" id="rulesList" style="margin-top:12px"></div>
      <div class="inline" style="margin-top:12px">
        <button class="ghost grow" id="ruleAdd">Añadir regla</button>
        <button id="rulesSave" hidden>Guardar</button>
      </div>
    </div>
  </section>

  <!-- STATUS -->
  <section id="v-status" hidden>
    <div class="card">
      <div class="head"><h2>Turno</h2></div>
      <div class="ledger" id="statusBody"></div>
    </div>
    <div class="card">
      <div class="head"><h3>En cola</h3><span class="count" id="queueCount"></span></div>
      <div class="ledger" id="queueList"></div>
    </div>
    <div class="card">
      <div class="head"><h3>Registro</h3></div>
      <div class="ledger" id="recentList"></div>
    </div>
    <button class="ghost" id="forget" style="width:100%">Desconectar este teléfono</button>
  </section>
</div>

<nav class="tabs" id="tabs" role="tablist" hidden>
  <button role="tab" data-tab="stock" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Almacén</button>
  <button role="tab" data-tab="order" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9-6 1 1-6z"/><path d="M13 5l6 6"/></svg>Orden</button>
  <button role="tab" data-tab="rules" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13-6l3 3M20 12a8 8 0 0 1-13 6l-3-3"/><path d="M20 3v6h-6M4 21v-6h6"/></svg>Reglas</button>
  <button role="tab" data-tab="status" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20a8 8 0 0 1 8-8M4 20a12 12 0 0 1 12-12"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/><path d="M15 4h5v5"/></svg>Turno</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
