<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<title>Pal Command</title>
<style>
  :root {
    --bg: #0e0c0a;
    --surf: #17130f;
    --surf-2: #1f1a14;
    --surf-3: #272018;
    --hair: #33291e;
    --hair-2: #453722;
    --ink: #f3ecdd;
    --ink-2: #b6a992;
    --ink-3: #7c705d;
    --brass: #eaa94a;
    --brass-ink: #1a1206;
    --brass-deep: #a56a1a;
    --live: #74cf88;
    --wait: #eab54a;
    --dead: #e5715a;
    --sheet-bg: rgba(20, 16, 12, .86);
    --glass: rgba(16, 13, 10, .72);
    --slot: linear-gradient(180deg, #241d16, #1b160f);
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4efe4; --surf: #fbf7ec; --surf-2: #f3ecdb; --surf-3: #ece2cb;
      --hair: #ddd0b6; --hair-2: #cbba98;
      --ink: #241d13; --ink-2: #6b6050; --ink-3: #948674;
      --brass: #b26f12; --brass-ink: #fff6e9; --brass-deep: #935c0d;
      --live: #4f8b53; --wait: #9a6d16; --dead: #b0432f;
      --sheet-bg: rgba(250, 245, 235, .9); --glass: rgba(248, 243, 232, .8);
      --slot: linear-gradient(180deg, #fbf6ea, #f1e8d4);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4efe4; --surf: #fbf7ec; --surf-2: #f3ecdb; --surf-3: #ece2cb;
    --hair: #ddd0b6; --hair-2: #cbba98;
    --ink: #241d13; --ink-2: #6b6050; --ink-3: #948674;
    --brass: #b26f12; --brass-ink: #fff6e9; --brass-deep: #935c0d;
    --live: #4f8b53; --wait: #9a6d16; --dead: #b0432f;
    --sheet-bg: rgba(250, 245, 235, .92); --glass: rgba(248, 243, 232, .82);
    --slot: linear-gradient(180deg, #fbf6ea, #f1e8d4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; overscroll-behavior-y: none; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  ::selection { background: var(--brass); color: var(--brass-ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1,h2,h3 { margin: 0; font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .03em; }
  [hidden] { display: none !important; }

  /* ---------- ambient glow ---------- */
  .ambient {
    position: fixed; inset: -30% 0 auto 0; height: 55vh; z-index: 0; pointer-events: none;
    background: radial-gradient(60% 60% at 50% 0%, var(--glow, rgba(234,169,74,.16)), transparent 70%);
    transition: background .6s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .ambient::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(40% 40% at 30% 10%, var(--glow, rgba(234,169,74,.10)), transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }
    @keyframes drift { to { transform: translate3d(18%, 6%, 0) scale(1.15); } }
  }

  /* ---------- shell ---------- */
  #app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 8px) 14px calc(76px + env(safe-area-inset-bottom)); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px 12px; }
  .brand { font: 700 19px/1 "Oswald", sans-serif; letter-spacing: .22em; }
  .brand span { color: var(--brass); }
  .conn {
    display: inline-flex; align-items: center; gap: 7px; background: var(--surf-2);
    border: 1px solid var(--hair); border-radius: 999px; padding: 6px 12px 6px 9px;
    font: 500 11.5px/1 "IBM Plex Mono", monospace; color: var(--ink-2); letter-spacing: .02em;
  }
  .conn .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none;
    box-shadow: 0 0 0 0 currentColor; }
  .conn.live { color: var(--live); } .conn.live .pulse { background: var(--live); }
  .conn.wait { color: var(--wait); } .conn.wait .pulse { background: var(--wait); }
  .conn.bad  { color: var(--dead); } .conn.bad  .pulse { background: var(--dead); }
  @media (prefers-reduced-motion: no-preference) {
    .conn.live .pulse { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0%{box-shadow:0 0 0 0 var(--live)} 70%,100%{box-shadow:0 0 0 7px transparent} }
  }

  /* ---------- cards / sections ---------- */
  .card { background: var(--surf); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 15px; margin-bottom: 12px; }
  .card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card > .hd h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
  .card > .hd h3 { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
  .tag { font: 600 10.5px/1 "IBM Plex Mono", monospace; color: var(--ink-3); letter-spacing: .05em; }
  .lede { color: var(--ink-2); font-size: 13px; margin: 3px 0 0; }

  /* ---------- inputs ---------- */
  .in {
    width: 100%; background: var(--surf-2); border: 1px solid var(--hair-2); border-radius: 11px;
    padding: 13px 14px; font-size: 16px; appearance: none; -webkit-appearance: none;
  }
  .in:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(234,169,74,.16); }
  select.in { padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: right 15px center, right 10px center; background-size: 6px 6px; background-repeat: no-repeat; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--brass); color: var(--brass-ink); border: 0; border-radius: 12px;
    padding: 13px 18px; font: 600 13px/1 "Oswald", sans-serif; letter-spacing: .09em; text-transform: uppercase;
    cursor: pointer; transition: transform .09s ease, filter .15s ease; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--hair-2); }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 11px; border-radius: 9px; }

  .field { position: relative; }
  .stack { display: grid; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .chk { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
  .chk input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brass); flex: none; }
  .ff { display: grid; gap: 4px; font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .ff .in { padding: 10px 11px; }

  /* ---------- stock: search + category bar + grid ---------- */
  .stockhead { position: sticky; top: 0; z-index: 5; padding: 4px 0 8px;
    background: linear-gradient(var(--bg) 62%, transparent); }
  .searchbox { position: relative; }
  .searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
  .searchbox .in { padding-left: 38px; }

  .catbar { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 2px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .catbar::-webkit-scrollbar { display: none; }
  .catbar button { flex: none; background: var(--surf-2); border: 1px solid var(--hair); color: var(--ink-2);
    border-radius: 999px; padding: 7px 13px; font: 600 11px/1 "Oswald", sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: all .12s; }
  .catbar button .c { font-family: "IBM Plex Mono", monospace; opacity: .6; margin-left: 5px; }
  .catbar button[aria-current="true"] { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }

  .totline { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 10px; }
  .totline b { font: 700 26px/1 "Oswald", sans-serif; }
  .totline span { font: 500 12px/1 "IBM Plex Mono", monospace; color: var(--ink-3); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 460px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .cell { display: grid; gap: 6px; cursor: pointer; animation: pop .28s cubic-bezier(.2,.8,.3,1) backwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }
  .slot { position: relative; aspect-ratio: 1; border-radius: 13px; background: var(--slot);
    border: 1px solid var(--hair-2); overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -10px 20px -12px rgba(0,0,0,.5); }
  .slot::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(70% 55% at 50% 12%, rgba(234,169,74,.10), transparent 70%); }
  .slot img { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .slot.noimg::after { content: attr(data-l); position: absolute; inset: 0; display: grid; place-items: center;
    font: 700 22px/1 "Oswald", sans-serif; color: var(--ink-3); }
  .slot .qty { position: absolute; right: 5px; bottom: 5px;
    font: 600 12px/1 "IBM Plex Mono", monospace; color: var(--ink);
    background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 3px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,.09); letter-spacing: .02em; }
  :root[data-theme="light"] .slot .qty, :root:not([data-theme="dark"]) .slot .qty { color: #fff; }
  .cell .lbl { font-size: 11px; line-height: 1.25; color: var(--ink-2); text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
  .cell.can .slot { border-color: color-mix(in srgb, var(--brass) 40%, var(--hair-2)); }

  /* skeleton */
  .sk { border-radius: 13px; aspect-ratio: 1; background: var(--surf-2);
    background: linear-gradient(100deg, var(--surf-2) 40%, var(--surf-3) 50%, var(--surf-2) 60%);
    background-size: 200% 100%; animation: sh 1.3s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* ---------- ledger rows (order/rules/status) ---------- */
  .rows { display: grid; }
  .lr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--hair); }
  .lr:last-child { border-bottom: 0; }
  .lr .l { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .lr .l .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--slot); border: 1px solid var(--hair-2);
    flex: none; object-fit: contain; padding: 3px; }
  .lr .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lr .sub { font: 500 10.5px/1.3 "IBM Plex Mono", monospace; color: var(--ink-3); }
  .lr .num { font: 600 15px/1 "IBM Plex Mono", monospace; }
  .pill { font: 600 10.5px/1.2 "IBM Plex Mono", monospace; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--hair-2); color: var(--ink-3); white-space: nowrap; }
  .pill.go { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, var(--hair-2)); }
  .pill.hold { color: var(--wait); border-color: color-mix(in srgb, var(--wait) 45%, var(--hair-2)); }
  .pill.no { color: var(--dead); border-color: color-mix(in srgb, var(--dead) 45%, var(--hair-2)); }

  /* gauge for rules */
  .gauge { height: 7px; border-radius: 999px; background: var(--surf-3); overflow: hidden; margin-top: 9px; position: relative; }
  .gauge i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--live); transition: width .5s cubic-bezier(.2,.8,.3,1); }
  .gauge i.low { background: var(--dead); } .gauge i.mid { background: var(--wait); }
  .gauge .min { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }

  /* machine chips grid */
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .mch { text-align: left; background: var(--surf-2); border: 1px solid var(--hair); border-radius: 12px;
    padding: 10px 11px; cursor: pointer; transition: border-color .12s, transform .09s; display: grid; gap: 5px; }
  .mch:active { transform: scale(.98); }
  .mch[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(234,169,74,.14); }
  .mch .t { font: 600 11px/1.1 "Oswald", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .mch .s { font: 500 10.5px/1.2 "IBM Plex Mono", monospace; color: var(--ink-3); }
  .mch.run { border-left: 3px solid var(--live); } .mch.hold { border-left: 3px solid var(--wait); }

  .empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 26px 10px; }
  .err { color: var(--dead); font-size: 12.5px; }

  /* ---------- tab bar ---------- */
  nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 20; display: flex;
    background: var(--glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--ink-3); padding: 9px 4px 10px;
    display: grid; gap: 4px; justify-items: center; cursor: pointer;
    font: 600 9.5px/1 "Oswald", sans-serif; letter-spacing: .11em; text-transform: uppercase; transition: color .15s; }
  nav.tabs button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s; }
  nav.tabs button[aria-selected="true"] { color: var(--brass); }
  nav.tabs button[aria-selected="true"] svg { transform: translateY(-1px) scale(1.08); }

  /* ---------- bottom sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .22s; }
  .scrim.on { opacity: 1; }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 41; background: var(--sheet-bg);
    backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border-top: 1px solid var(--hair-2); border-radius: 22px 22px 0 0;
    padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(101%); transition: transform .28s cubic-bezier(.2,.8,.3,1); max-height: 82dvh; overflow-y: auto; }
  .sheet.on { transform: translateY(0); }
  .sheet .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--hair-2); margin: 6px auto 14px; }
  .sheet .big { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
  .sheet .big .slot { width: 74px; height: 74px; flex: none; aspect-ratio: auto; }
  .sheet .big h2 { font-size: 19px; }
  .sheet .big .sub { font: 500 11px/1.3 "IBM Plex Mono", monospace; color: var(--ink-3); margin-top: 3px; }

  /* ---------- toast ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px); z-index: 50; background: var(--ink); color: var(--bg);
    font: 500 13.5px/1.3 "IBM Plex Sans"; padding: 11px 16px; border-radius: 12px; max-width: 84vw;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--dead); color: #fff; }

  .spin { width: 15px; height: 15px; border: 2px solid var(--hair-2); border-top-color: var(--brass);
    border-radius: 50%; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  main > section { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>

<div id="app">
  <div class="topbar">
    <div class="brand">PAL <span>COMMAND</span></div>
    <button class="conn" id="conn" hidden><span class="pulse"></span><span id="connText">—</span></button>
  </div>

  <!-- SETUP -->
  <section id="v-setup" hidden>
    <div class="card">
      <div class="hd"><h2>Conectar servidor</h2></div>
      <p class="lede">Pegá la URL de tu Worker y el token. Se guardan solo en este teléfono.</p>
      <div class="stack" style="margin-top:14px">
        <input class="in" id="cfgUrl" placeholder="https://pal-command.xxx.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" />
        <input class="in" id="cfgToken" type="password" placeholder="Token de acceso" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button class="btn wide" id="cfgSave">Conectar</button>
        <button class="btn ghost wide" id="cfgDemo">Ver demo</button>
        <p class="err" id="cfgErr" hidden></p>
      </div>
    </div>
  </section>

  <!-- STOCK -->
  <section id="v-stock" hidden>
    <div class="stockhead">
      <div class="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="in" id="q" placeholder="Buscar item…" autocapitalize="off" />
      </div>
      <div class="catbar" id="catbar"></div>
    </div>
    <div class="totline" id="totline" hidden><b id="totN">0</b><span id="totLbl"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ORDER -->
  <section id="v-order" hidden>
    <div class="card">
      <div class="hd"><h2>Nueva orden</h2></div>
      <div class="stack">
        <select class="in" id="ordRecipe"></select>
        <select class="in" id="ordMachine"></select>
        <div class="row2">
          <input class="in" id="ordCount" type="number" min="1" inputmode="numeric" value="50" />
          <button class="btn" id="ordGo">Pedir</button>
        </div>
        <label class="chk"><input type="checkbox" id="ordTransport" checked /> Un Pal lo lleva al cofre</label>
        <p class="lede" id="ordHint"></p>
      </div>
    </div>
    <div class="card">
      <div class="hd"><h3>El taller</h3><span class="tag" id="floorCount"></span></div>
      <div class="mgrid" id="floorGrid"></div>
    </div>
  </section>

  <!-- RULES -->
  <section id="v-rules" hidden>
    <div class="card">
      <div class="hd"><h2>Reglas fijas</h2></div>
      <p class="lede">Cuando el total baja del mínimo, se fabrica hasta el objetivo — en tandas.</p>
      <div class="stack" id="rulesList" style="margin-top:14px"></div>
      <div class="row2" style="margin-top:12px">
        <button class="btn ghost" id="ruleAdd">Añadir regla</button>
        <button class="btn" id="rulesSave" hidden>Guardar</button>
      </div>
    </div>
  </section>

  <!-- STATUS -->
  <section id="v-status" hidden>
    <div class="card" id="turnCard">
      <div class="hd"><h2>Turno</h2><span class="tag" id="turnSync"></span></div>
      <div class="rows" id="turnBody"></div>
    </div>
    <div class="card">
      <div class="hd"><h3>En cola</h3><span class="tag" id="queueCount"></span></div>
      <div class="rows" id="queueList"></div>
    </div>
    <div class="card">
      <div class="hd"><h3>En marcha</h3><span class="tag" id="watchCount"></span></div>
      <div class="rows" id="watchList"></div>
    </div>
    <div class="card" id="ruleStatusCard" hidden>
      <div class="hd"><h3>Reglas activas</h3></div>
      <div class="rows" id="ruleStatusList"></div>
    </div>
    <div class="card">
      <div class="hd"><h3>Registro</h3></div>
      <div class="rows" id="recentList"></div>
    </div>
    <button class="btn ghost wide" id="forget">Desconectar este teléfono</button>
  </section>
</div>

<nav class="tabs" id="tabs" role="tablist" hidden>
  <button role="tab" data-tab="stock" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Almacén</button>
