; PalCommand -- server-side companion for the Pal Command app.
; Edit while the server is stopped, then restart so UE4SS reloads it cleanly.

[PalCommand]
Enabled=true

; How often (seconds) to rescan stations + apply rules. A full inventory walk
; runs every 4th cycle; the others are stations-only (fast).
ScanIntervalSeconds=30

; Max orders emitted per flush (per player-craft on the replay backend).
MaxOrdersPerFlush=8

; Deliver finished product to base storage (a Pal carries it to a chest).
DefaultTransportToStorage=true

; Include the guild chest in the inventory snapshot.
IncludeGuildChest=true

; Drop an order after this many failed placement attempts.
MaxOrderAttempts=6

; Run the reverse-engineering diagnostics (zero-player autonomy research) once at
; startup. Not needed for normal crafting -- leave false.
DebugDiagnostics=false

; --- Cloud sync (optional) -------------------------------------------------
; Leave blank to run purely file-based (data/*.json fetched via the host file API).
; When set, the mod polls the Worker for orders/rules and posts inventory/state.
WorkerBaseUrl=
ServerToken=
