; PalCommand -- server-side companion for the Pal Command app.
; Edit while the server is stopped, then restart so UE4SS reloads it cleanly.

[PalCommand]
Enabled=true

; Scan pacing is dynamic. When there is queue activity, a fresh order, or the app
; is open (see PulseActiveWindowSeconds), the mod scans every ScanIntervalSeconds.
; When nothing is happening it backs off to IdleScanIntervalSeconds (fewer
; game-thread reflection passes -> fewer hitches, e.g. when you open the in-game map).
ScanIntervalSeconds=20
IdleScanIntervalSeconds=120

; The full walk of every base chest (the expensive part) runs once every Nth scan.
; Lower = fresher item counts, more game-thread work. While the app is open this is
; forced to 2 regardless of this value.
InventoryEveryNthScan=4

; The app writes data/pulse.json while it is open. For this many seconds after the
; last write the mod stays on the ACTIVE cadence and walks the inventory every 2nd
; scan (~40s-fresh counts). 0 disables it (back to pure idle/active-on-orders).
; The app's "refresh now" button forces one immediate full walk regardless.
PulseActiveWindowSeconds=120

; Max orders emitted per flush (per player-craft on the replay backend).
MaxOrdersPerFlush=8

; After a standing rule fires, it can't fire again for this long (seconds) — stops
; a wobbling inventory count from making a rule thrash.
RuleCooldownSeconds=90

; Deliver finished product to base storage (a Pal carries it to a chest).
DefaultTransportToStorage=true

; Include the guild chest in the inventory snapshot.
IncludeGuildChest=true

; Drop an order after this many failed placement attempts.
MaxOrderAttempts=6

; Run the reverse-engineering diagnostics (zero-player autonomy research) once at
; startup. Not needed for normal crafting -- leave false.
DebugDiagnostics=false

; --- Cloud sync (optional) -------------------------------------------------
; Leave blank to run purely file-based (data/*.json fetched via the host file API).
; When set, the mod polls the Worker for orders/rules and posts inventory/state.
WorkerBaseUrl=
ServerToken=
